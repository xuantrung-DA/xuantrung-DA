<svg xmlns="http://www.w3.org/2000/svg" width="160" height="46" viewBox="0 0 160 46" role="img" aria-labelledby="title desc" style="--bg:#f5f5f0;--panel:#ffffff;--line:#d3d5cc;--ink:#20222b;--muted:#5a6270;--lime:#587d13;--violet:#7356bf;--soft:#e9e5f5">
<title id="title">LinkedIn</title><desc id="desc">AI engineering profile. Written content stays visible; motion is decorative.</desc><defs><style>text{font-family:Arial,"Segoe UI",sans-serif}
