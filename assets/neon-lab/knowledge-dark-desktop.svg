unk" width="22" height="5" rx="2" fill="var(--violet)" style="animation-delay:-1.2s"/></g><g transform="translate(54 115)"><rect class="sys-chunk" width="22" height="5" rx="2" fill="var(--violet)" style="animation-delay:-1.7999999999999998s"/></g><g transform="translate(54 127)"><rect class="sys-chunk" width="22" height="5" rx="2" fill="var(--violet)" style="animation-delay:-2.4s"/></g><path d="M70 105C101 105 98 128 118 128" fill="none" stroke="var(--violet)" stroke-opacity=".24"/><path class="sys-packet" d="M70 105C101 105 98 128 118 128" pathLength="100" fill="none" stroke="var(--violet)" stroke-width="2.3" stroke-linecap="round" filter="url(#sys-glow)" style="animation-delay:-0s"/><g class="sys-chip"><path d="M113 89V147C113 158 162 158 162 147V89" fill="var(--bg)" stroke="var(--violet)"/><ellipse cx="137.5" cy="89" rx="24.5" ry="10" fill="var(--soft)" stroke="var(--violet)"/><path d="M113 112C113 124 162 124 162 112M113 135C113 147 162 147 162 135" fill="none" stroke="var(--violet)" stroke-opacity=".45"/></g><rect class="sys-fire" x="120" y="101" width="3" height="5" rx="1" fill="var(--lime)" style="animation-delay:-0.00s"/><rect class="sys-fire" x="127" y="101" width="3" height="5" rx="1" fill="var(--lime)" style="animation-delay:-0.24s"/><rect class="sys-fire" x="134" y="101" width="3" height="5" rx="1" fill="var(--lime)" style="animation-delay:-0.48s"/><rect class="sys-fire" x="141" y="101" width="3" height="5" rx="1" fill="var(--lime)" style="animation-delay:-0.72s"/><rect class="sys-fire" x="148" y="101" width="3" height="5" rx="1" fill="var(--lime)" style="animation-delay:-0.96s"/><rect class="sys-fire" x="120" y="123" width="3" height="5" rx="1" fill="var(--lime)" style="animation-delay:-0.24s"/><rect class="sys-fire" x="127" y="123" width="3" height="5" rx="1" fill="var(--lime)" style="animation-delay:-0.48s"/><rect class="sys-fire" x="134" y="123" width="3" height="5" rx="1" fill="var(--lime)" style="animation-delay:-0.72s"/><rect class="sys-fire" x="1