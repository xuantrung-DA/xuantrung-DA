<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="100" viewBox="0 0 1000 100" role="img" aria-labelledby="title desc" style="--bg:#f5f5f0;--panel:#ffffff;--line:#d3d5cc;--ink:#20222b;--muted:#5a6270;--lime:#587d13;--violet:#7356bf;--soft:#e9e5f5">
<title id="title">work</title><desc id="desc">AI engineering profile. Written content stays visible; motion is decorative.</desc><defs><style>text{font-family:Arial,"Segoe UI",sans-serif}
.mono{font-family:Consolas,"Courier New",monospace}
.star-spin{animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<radialGradient id="haze"><stop stop-color="#7356bf" stop-opacity=".15"/><stop offset="1" stop-color="#7356bf" stop-opacity="0"/></radialGradient>
<linearGradient id="scan-grad"><stop stop-color="#587d13" stop-opacity="0"/><stop offset="1" stop-color="#587d13" stop-opacity=".2"/></linearGradient>
</defs><text x="8" y="24" font-size="12" fill="var(--lime)" font-weight="500" class="mono" letter-spacing="1.1">01 / SELECTED SYSTEMS</text><text x="6" y="68" font-size="44" fill="var(--ink)" font-weight="700" letter-spacing="-1.8">Proof of work.</text><text x="953" y="66" font-size="12" fill="var(--muted)" font-weight="500" class="mono" letter-spacing="1.1">[04]</text></svg>