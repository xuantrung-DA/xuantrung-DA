    <linearGradient id="signature-ruby"><stop stop-color="var(--ruby)" stop-opacity="0"/><stop offset=".72" stop-color="var(--ruby)" stop-opacity=".38"/><stop offset="1" stop-color="var(--ruby)" stop-opacity="0"/></linearGradient>
    </defs><path d="M18 1H365L399 35V350Q399 367 382 367H35L1 333V18Q1 1 18 1Z" fill="url(#cr-panel)" stroke="url(#cr-edge)" stroke-opacity=".55" stroke-width="1.3"/><path d="M18 1H365L399 35V350Q399 367 382 367H35L1 333V18Q1 1 18 1Z" fill="url(#cr-grain)"/><path d="M22 3H361M3 26V326" fill="none" stroke="var(--silver)" stroke-opacity=".15"/><path d="M368 8L392 32M8 336L32 360" stroke="var(--ruby)" stroke-opacity=".7" stroke-width="2"/><path d="M36 366H376" pathLength="100" class="cr-trace" stroke="var(--ruby)" stroke-opacity=".7" stroke-width="1.6"/><text x="24" y="34" font-size="9" fill="var(--ruby)" font-weight="500" class="mono" letter-spacing="1.1">OPEN TO AI ENGINEERING OPPORTUNITIES</text><defs><g id="footer-title-glyphs"><text id="footer-title-line-0" x="21" y="106" font-size="48" font-weight="700" letter-spacing="-2">let’s build</text><text id="footer-title-line-1" x="21" y="158" font-size="48" font-weight="700" letter-spacing="-2">what’s next.</text></g><clipPath id="footer-title-clip"><use href="#footer-title-line-0"/><use href="#footer-title-line-1"/></clipPath></defs><g class="signature-title" role="presentation"><use href="#footer-title-line-0" fill="url(#cr-type)"/><use href="#footer-title-line-1" fill="url(#cr-type)"/><g clip-path="url(#footer-title-clip)"><g class="signature-sweep" style="--period:8s;--travel:495px"><path d="M-75 67H15L115 165H25Z" fill="url(#signature-glint)"/><path d="M6 67H28L128 165H106Z" fill="url(#signature-ruby)"/></g></g></g><g transform="translate(349 193)" aria-hidden="true"><circle class="signature-ring" r="26" fill="none" stroke="var(--ruby)" stroke-width=".8"/><circle r="29" fill="none" stroke="var(--silver)" stroke-opacity=".16"/><g class="cr-reverse"><circle r="29" fill="none" stroke="var(--ruby)" stroke-width="1.3" stroke-dasharray="14.45 153"/><circle cx="29" r="1.8" fill="var(--silver)"/></g></g><g transform="translate(349 193)"><g class="star-spin"><path transform="rotate(0)" d="M0 -17Q16.15 -14.45 7.31 -2.55L2.04 2.55Q7.65 -10.88 0 -17Z" fill="url(#cr-metal)"/><path transform="rotate(90)" d="M0 -17Q16.15 -14.45 7.31 -2.55L2.04 2.55Q7.65 -10.88 0 -17Z" fill="url(#cr-metal)"/><path transform="rotate(180)" d="M0 -17Q16.15 -14.45 7.31 -2.55L2.04 2.55Q7.65 -10.88 0 -17Z" fill="url(#cr-metal)"/><path transform="rotate(270)" d="M0 -17Q16.15 -14.45 7.31 -2.55L2.04 2.55Q7.65 -10.88 0 -17Z" fill="url(#cr-metal)"/></g><circle r="2.72" fill="var(--ruby)"/></g><text x="24" y="207" font-size="18" fill="var(--silver)" font-weight="500" >nxt276651@gmail.com ↗</text><text x="24" y="252" font-size="15" fill="var(--muted)" font-weight="400" >Part-time through Jun 2027.</text><text x="24" y="275" font-size="15" fill="var(--muted)" font-weight="400" >Full-time from Jul 2027.</text><path d="M24 296H376" stroke="var(--line)"/><text x="24" y="324" font-size="13" fill="var(--muted)" font-weight="400" >B.Sc. AI · FPT University · GPA 3.75/4.0</text><text x="24" y="345" font-size="13" fill="var(--muted)" font-weight="400" >Expected graduation: Jun 2027</text><path d="M24 219H267" stroke="var(--silver)" stroke-opacity=".14"/><path class="signature-packet" pathLength="100" d="M24 219H267" fill="none" stroke="var(--ruby)" stroke-width="1.4"/><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style></svg>