name: Profile Metrics

on:
  workflow_dispatch:
  schedule:
    # 17:17 UTC = 00:17 Asia/Ho_Chi_Minh
    - cron: "17 17 * * *"

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate GitHub activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: xuantrung-DA

          filename: assets/github-activity.svg

          template: classic
          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          config_timezone: Asia/Ho_Chi_Minh
